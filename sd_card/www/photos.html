<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>InOut — Photos</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="app" class="show">
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4z"/></svg></div><div><div class="logo-name">InOut</div><div class="logo-sub" id="sb-id">—</div></div></div>
  <nav id="main-nav"></nav>
  <div class="user-chip"><div class="user-av" id="user-av">A</div><div class="user-info"><div class="user-name" id="user-name">—</div><div class="user-role" id="user-role">—</div></div></div>
  <div class="sync-bar"><div class="sdot off" id="sdot"></div><span id="sync-txt">Connecting…</span></div>
  <div class="sidebar-footer">
    <button class="ni" onclick="openChangePassword()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Change password</button>
    <button class="ni" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </div>
</aside>
<div class="main-area">
  <div class="topbar">
    <button class="menu-btn" onclick="openSidebar()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="page-title">Photos</span>
    <div class="tb-right"><span class="server-chip" id="chip">● Offline</span></div>
  </div>
  <div class="offline-bar" id="offline-bar"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Server unreachable.</div>
  <div class="content">
    <div class="card" style="margin-bottom:14px">
      <div class="card-hd">
        <h2>Photos</h2>
        <button class="btn btn-sm" onclick="loadPhotos()">Refresh</button>
      </div>
      <div class="toolbar">
        <input type="text" id="photo-q" placeholder="Name or UID…" oninput="renderPhotos()">
      </div>
    </div>
    <div id="photo-grid-wrap"></div>
  </div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="/common.js"></script>
<script>
if(!TOKEN){location.replace('/');throw'';}
initShell('photos');

let _photos=[];

async function loadPhotos(){
  const r=await lg('/api/photos');
  if(r?.photos){_photos=r.photos;renderPhotos();}
}

function renderPhotos(){
  const q=(document.getElementById('photo-q')?.value||'').toLowerCase();
  const wrap=document.getElementById('photo-grid-wrap');if(!wrap)return;
  const filtered=_photos.filter(p=>!q||(p.name||'').toLowerCase().includes(q)||(p.uid||'').toLowerCase().includes(q));
  if(!filtered.length){
    wrap.innerHTML='<div style="text-align:center;padding:40px;color:var(--hint);font-size:13px">'+
      (_photos.length?'No photos match filter':'No photos yet — tap an authorised card to capture one')+'</div>';
    return;
  }
  const sorted=[...filtered].sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  wrap.innerHTML='<div class="photo-grid">'+sorted.map(p=>`
    <div class="photo-card">
      <img src="/photos/${p.file}?token=${TOKEN}" alt="" loading="lazy" onerror="this.style.display='none'" onclick="viewPhoto('${p.file}')" style="cursor:pointer">
      <div class="photo-meta">
        <div class="photo-name">${p.name||'<span style="color:var(--hint)">Unknown</span>'}</div>
        <div class="photo-uid">${p.uid}</div>
        <div class="photo-ts">${p.ts||''}</div>
        <button class="photo-del" onclick="deletePhoto('${p.file}')">Delete</button>
      </div>
    </div>`).join('')+'</div>';
}

function viewPhoto(file){window.open('/photos/'+file+'?token='+TOKEN,'_blank');}

async function deletePhoto(file){
  if(!confirm('Delete this photo?'))return;
  const r=await fetch('/api/photos/delete',{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':TOKEN},body:JSON.stringify({file})});
  if(r.ok){_photos=_photos.filter(p=>p.file!==file);renderPhotos();}
  else alert('Delete failed');
}

loadPhotos();
</script>
</body>
</html>
