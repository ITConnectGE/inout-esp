<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>InOut — Device info</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="app" class="show">
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4z"/></svg></div><div><div class="logo-name">InOut</div><div class="logo-sub" id="sb-id">—</div></div></div>
  <nav id="main-nav"></nav>
  <div class="user-chip"><div class="user-av" id="user-av">A</div><div class="user-info"><div class="user-name" id="user-name">—</div><div class="user-role" id="user-role">—</div></div></div>
  <div class="sync-bar"><div class="sdot off" id="sdot"></div><span id="sync-txt">Connecting…</span></div>
  <div class="sidebar-footer">
    <button class="ni" onclick="openChangePassword()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Change password</button>
    <button class="ni" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </div>
</aside>
<div class="main-area">
  <div class="topbar">
    <button class="menu-btn" onclick="openSidebar()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="page-title">Device info</span>
    <div class="tb-right">
      <span class="server-chip" id="chip">● Offline</span>
      <button class="btn btn-sm" onclick="loadDevice()">Refresh</button>
    </div>
  </div>
  <div class="offline-bar" id="offline-bar"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Server unreachable.</div>
  <div class="content">
    <div id="device-body"></div>
  </div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="/common.js"></script>
<script>
if(!TOKEN){location.replace('/');throw'';}
if(ROLE!=='super_admin'){location.replace('/');throw'';}
initShell('devices');

async function loadDevice(){
  const s=await lg('/api/local/status');if(!s)return;
  const sb=document.getElementById('sb-id');if(sb)sb.textContent=s.identifier||'Device';
  document.getElementById('device-body').innerHTML=`
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:12px;flex-wrap:wrap">
        <div><div style="font-size:15px;font-weight:600">${s.identifier||'Device'}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">v${s.firmware||'?'} · ${s.ip||'—'}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="badge ${s.sd_mounted?'b-active':'b-denied'}">${s.sd_mounted?'SD OK':'No SD'}</span>
          <span class="badge ${s.ntp_synced?'b-active':'b-pending'}">${s.ntp_synced?'NTP OK':'No NTP'}</span>
        </div>
      </div>
      <div class="dg">
        <div class="dg-l">Server</div><div class="dg-v">${s.server_url||'Not set'}</div>
        <div class="dg-l">CS IN/OUT</div><div class="dg-v">GPIO ${s.cs_in} / ${s.cs_out}</div>
        <div class="dg-l">CS SD</div><div class="dg-v">GPIO ${s.cs_sd}</div>
        <div class="dg-l">Relay</div><div class="dg-v">GPIO ${s.relay_pin} · ${s.relay_ms}ms</div>
        <div class="dg-l">SD</div><div class="dg-v">${s.sd_used_mb||0}/${s.sd_total_mb||0} MB</div>
        <div class="dg-l">Employees</div><div class="dg-v">${s.employee_count||0}</div>
        <div class="dg-l">Unsynced</div><div class="dg-v">${s.unsynced_events||0} events</div>
        <div class="dg-l">Uptime</div><div class="dg-v">${fmtUptime(s.uptime_s)}</div>
        <div class="dg-l">Time</div><div class="dg-v">${fmtTsLocal(s.current_time)}</div>
        <div class="dg-l">RSSI</div><div class="dg-v">${s.rssi||'—'} dBm</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="doOpen()">🔓 Test relay</button>
        <button class="btn btn-sm btn-primary" onclick="forceSync()">↻ Sync</button>
      </div>
    </div>`;
}

async function doOpen(){const r=await fetch('/api/open',{method:'POST',headers:headers()});toast(r.ok?'Relay triggered ✓':'Failed');}
async function forceSync(){toast('Syncing…');await Promise.all([loadDevice(),syncServer()]);toast('Done ✓');}

loadDevice();
setInterval(loadDevice,15000);
</script>
</body>
</html>
