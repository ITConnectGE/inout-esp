<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>InOut — Events</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="app" class="show">
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4z"/></svg></div><div><div class="logo-name">InOut</div><div class="logo-sub" id="sb-id">—</div></div></div>
  <nav id="main-nav"></nav>
  <div class="user-chip"><div class="user-av" id="user-av">A</div><div class="user-info"><div class="user-name" id="user-name">—</div><div class="user-role" id="user-role">—</div></div></div>
  <div class="sync-bar"><div class="sdot off" id="sdot"></div><span id="sync-txt">Connecting…</span></div>
  <div class="sidebar-footer">
    <button class="ni" onclick="openChangePassword()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Change password</button>
    <button class="ni" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </div>
</aside>
<div class="main-area">
  <div class="topbar">
    <button class="menu-btn" onclick="openSidebar()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="page-title">Events</span>
    <div class="tb-right">
      <span class="server-chip" id="chip">● Offline</span>
      <button class="btn btn-sm" onclick="forceSync()">Sync</button>
    </div>
  </div>
  <div class="offline-bar" id="offline-bar"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Server unreachable — showing local data.</div>
  <div class="content">
    <div class="card">
      <div class="card-hd"><h2>Access events</h2>
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:11px;color:var(--muted);padding:2px 7px;background:var(--s2);border-radius:99px">Local</span>
          <button class="btn btn-sm" onclick="exportCsv()">Export</button>
        </div>
      </div>
      <div class="toolbar">
        <input type="text" id="ev-q" placeholder="Name or UID…" oninput="renderEvents()">
        <select id="ev-dir" onchange="renderEvents()"><option value="">All dirs</option><option value="in">IN</option><option value="out">OUT</option></select>
        <select id="ev-dec" onchange="renderEvents()"><option value="">All</option><option value="granted">Granted</option><option value="denied">Denied</option></select>
        <select id="ev-syn" onchange="renderEvents()"><option value="">All sync</option><option value="false">Unsynced</option><option value="true">Synced</option></select>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Employee</th><th class="hide-xs">UID</th><th>Dir</th><th>Decision</th><th class="hide-xs">Sync</th><th>Time</th></tr></thead>
        <tbody id="ev-body"></tbody>
      </table></div>
    </div>
  </div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="/common.js"></script>
<script>
if(!TOKEN){location.replace('/');throw'';}
initShell('events');

let _events=[];

async function loadEvents(){
  const r=await lg('/api/local/events?limit=100');
  if(r?.events){_events=r.events;renderEvents();}
}

function renderEvents(){
  const q=(document.getElementById('ev-q')?.value||'').toLowerCase();
  const d=document.getElementById('ev-dir')?.value||'';
  const dec=document.getElementById('ev-dec')?.value||'';
  const syn=document.getElementById('ev-syn')?.value||'';
  const rows=_events.filter(e=>
    (!q||(e.name||'').toLowerCase().includes(q)||(e.uid||'').toLowerCase().includes(q))
    &&(!d||e.dir===d)&&(!dec||e.decision===dec)&&(!syn||String(e.synced)===syn));
  const b=document.getElementById('ev-body');if(!b)return;
  b.innerHTML=rows.length?rows.map(e=>`
    <tr>
      <td><div style="display:flex;align-items:center;gap:7px">${av(e.name||'?')}<span>${e.name||'Unknown'}</span></div></td>
      <td class="hide-xs" style="font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)">${e.uid||'—'}</td>
      <td><span class="badge ${e.dir==='in'?'b-in':'b-out'}">${(e.dir||'?').toUpperCase()}</span></td>
      <td><span class="badge ${e.decision==='granted'?'b-granted':'b-denied'}">${e.decision||'—'}</span></td>
      <td class="hide-xs"><span class="badge ${e.synced?'b-synced':'b-pending'}">${e.synced?'Synced':'Local'}</span></td>
      <td style="color:var(--muted);font-size:11px;white-space:nowrap">${fmtTsLocal(e.ts)}</td>
    </tr>`).join('')
    :'<tr class="empty-row"><td colspan="6">No events match filter</td></tr>';
}

function exportCsv(){
  const csv='timestamp,name,uid,direction,decision,sync\n'+
    _events.map(e=>[e.ts,e.name||'',e.uid||'',e.dir||'',e.decision||'',e.synced?'synced':'local'].join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='inout-events-'+Date.now()+'.csv';a.click();
}

async function forceSync(){toast('Syncing…');await Promise.all([loadEvents(),syncServer()]);toast('Done ✓');}

loadEvents();
setInterval(loadEvents,30000);
</script>
</body>
</html>
