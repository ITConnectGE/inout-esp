<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>InOut — Device log</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="app" class="show">
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4z"/></svg></div><div><div class="logo-name">InOut</div><div class="logo-sub" id="sb-id">—</div></div></div>
  <nav id="main-nav"></nav>
  <div class="user-chip"><div class="user-av" id="user-av">A</div><div class="user-info"><div class="user-name" id="user-name">—</div><div class="user-role" id="user-role">—</div></div></div>
  <div class="sync-bar"><div class="sdot off" id="sdot"></div><span id="sync-txt">Connecting…</span></div>
  <div class="sidebar-footer">
    <button class="ni" onclick="openChangePassword()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Change password</button>
    <button class="ni" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </div>
</aside>
<div class="main-area">
  <div class="topbar">
    <button class="menu-btn" onclick="openSidebar()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="page-title">Device log</span>
    <div class="tb-right"><span class="server-chip" id="chip">● Offline</span></div>
  </div>
  <div class="offline-bar" id="offline-bar"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Server unreachable.</div>
  <div class="content">
    <div class="card">
      <div class="card-hd"><h2>Device log</h2>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <select id="log-lvl" onchange="renderDevLog()" style="padding:5px 8px;border-radius:var(--rsm);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:12px;font-family:inherit;outline:none">
            <option value="">All levels</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
          <button class="btn btn-sm" onclick="loadDevLog()">Refresh</button>
          <button class="btn btn-sm btn-danger" onclick="clearDevLog()">Clear log</button>
        </div>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th style="width:120px">Time</th><th style="width:64px">Level</th><th style="width:72px">Module</th><th>Message</th></tr></thead>
        <tbody id="devlog-body"></tbody>
      </table></div>
    </div>
  </div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="/common.js"></script>
<script>
if(!TOKEN){location.replace('/');throw'';}
if(ROLE!=='super_admin'){location.replace('/');throw'';}
initShell('devlog');

let _devLogs=[];

async function loadDevLog(){
  const r=await lg('/api/logs?limit=300');
  if(r?.logs){_devLogs=r.logs;renderDevLog();}
}

function renderDevLog(){
  const lvl=document.getElementById('log-lvl')?.value||'';
  const rows=lvl?_devLogs.filter(l=>l.level===lvl):_devLogs;
  const b=document.getElementById('devlog-body');if(!b)return;
  const badge=l=>{
    if(l==='ERROR')return'<span class="badge b-denied">ERROR</span>';
    if(l==='WARN')return'<span class="badge b-pending">WARN</span>';
    return'<span class="badge b-synced" style="font-size:10px">INFO</span>';
  };
  b.innerHTML=rows.length?rows.map(e=>`
    <tr>
      <td style="color:var(--muted);font-size:11px;white-space:nowrap">${fmtTsLocal(e.ts||'')}</td>
      <td>${badge(e.level||'INFO')}</td>
      <td style="font-family:ui-monospace,monospace;font-size:11px;color:var(--blue-tx)">${e.module||'—'}</td>
      <td style="font-size:12px">${e.msg||''}${e.detail?`<div class="log-detail">${e.detail}</div>`:''}</td>
    </tr>`).join('')
    :'<tr class="empty-row"><td colspan="4">No log entries</td></tr>';
}

async function clearDevLog(){
  if(!confirm('Clear all device log entries?'))return;
  const r=await api('DELETE','/api/logs');
  if(r?.ok){_devLogs=[];renderDevLog();toast('Log cleared');}
  else toast('Error: '+(r?.data?.error||'failed'));
}

loadDevLog();
</script>
</body>
</html>
