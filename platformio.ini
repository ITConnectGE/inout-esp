[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_filters = log2file
upload_speed  = 921600

board_build.partitions = min_spiffs.csv

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit PN532 @ ^1.3.4
    adafruit/Adafruit BusIO @ ^1.15.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    ; SD.h bundled with ESP32 Arduino core
    ; mbedtls (SHA-256) bundled with ESP32 Arduino core

build_flags =
    ; Level 3 (INFO) drowns the log in framework noise — e.g. WiFiClient.cpp's
    ; "connected(): Unexpected: RES: 0, ERR: 9" fires on every stale-socket
    ; recheck and says nothing actionable. Level 2 (WARN) keeps genuine
    ; WebServer/WiFiClient warnings and errors, drops the info-level spam.
    ; Our own Logger (Serial-based, not the esp32-hal-log macros) is unaffected.
    -DCORE_DEBUG_LEVEL=2
    -std=gnu++17
    ; Reduce mbedTLS I/O buffer from the default 16 KB down to 4 KB per
    ; direction. Each WiFiClientSecure normally reserves 32 KB for TLS record
    ; buffers; this cuts that to 8 KB. GitHub releases and the Laravel API both
    ; fit comfortably within 4 KB TLS records.
    -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
    -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

; ── Flash commands ────────────────────────────────────────────────────────────
; 1. pio run --target upload        flash firmware
; 2. Copy sd_card/www/index.html AND index.html.gz → SD card /www/
;    (server prefers the .gz when present; regenerate it after editing
;    index.html with: gzip -9 -k -f sd_card/www/index.html)
;
; Wiring (single VSPI bus):
;   SCK=18  MISO=19  MOSI=23
;   CS_IN=4  CS_OUT=25  CS_SD=32
;   RELAY=26  BUZZ=15
;   SERVER_LED=27  READER_LED=14  SD_LED=13  CAM_LED=12
;   LCD SDA=21  SCL=22
;   BTN_RESET=VN(39)  BTN_FORGET=VP(36)  — external pull-ups, idle HIGH, pressed LOW
;     RESET: tap = restart, hold 5s+ = factory reset
;     FORGET: hold 3s+ = erase WiFi credentials + restart
